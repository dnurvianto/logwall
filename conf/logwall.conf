# ==============================================================================
# logwall — Central Configuration File
# Reference: docs/DESIGN.md §13 (Centralized Configuration)
# Note: All paths and parameters can be overridden here without modifying code.
# ==============================================================================

# ===== General Settings =====
#
# BACKEND decides ONE thing: who enforces the blocks.
#   csf   = coordination. CSF owns the blocklist; logwall installs no chains and
#           no sets, and every block is pushed with `csf -d`.
#   auto  = everything else. logwall enforces through its own LOGWALL_* chains and
#           ipsets, layered on top of whatever owns the baseline.
#
# The other values below are detected, not chosen: they name whoever owns boot
# PERSISTENCE, which decides only whether logwall writes a ruleset file or leaves
# it alone. firewalld and ufw are baseline managers, not enforcement backends —
# logwall coexists with them rather than deferring to them.
BACKEND=auto                # Enforcement: csf (coordination) | auto (standalone)
                            # Detected persistence owners: nftables | firewalld | ufw | iptables

# Declares what you know about the IPv6 side of the baseline.
#
# A host can be carefully locked down on IPv4 and still accept every IPv6
# connection on earth to the same services — at which point the IPv4 rules are
# decoration. logwall detects that and refuses to proceed silently.
#
#   auto      = logwall checks. IPv4 filtered but IPv6 wide open -> BLOCKER,
#               with two ways out (this is the shipping default).
#   external  = you have seen the exposure and accept it, or something upstream
#               filters IPv6 that logwall cannot see. Downgraded to INFO.
#
# This is deliberately NOT covered by --accept-warnings: that flag also dismisses
# threshold suggestions, and a gap that makes every IPv4 restriction bypassable
# should cost one deliberate line, not a blanket yes.
IPV6_BASELINE=auto

# ===== CSF coordination (only read when BACKEND=csf) =====
CSF_DENY=/etc/csf/csf.deny  # Source of truth for what CSF already enforces.
                            # logwall pushes the DIFFERENCE between the blacklist
                            # and this file, so a list seeded from a retired tool
                            # reaches CSF instead of sitting unused.
CSF_RESYNC_MAX_PER_RUN=200  # Cap on catch-up pushes per cycle. Each address is one
                            # `csf -d`, i.e. one Perl process; a migration of
                            # thousands drains over several cycles instead of
                            # hanging a single one.

# MASTER SAFETY SWITCH.
#   0 = observe only. Candidates are detected and recorded, sets are populated,
#       but NO packet is ever dropped. This is the shipping default.
#   1 = enforce. The DROP rule referencing BLACKLIST_SET is installed.
# Flip to 1 only after reviewing /etc/logwall/blacklist_ips.txt.
ENFORCE=0

# Declares where the default-deny baseline comes from.
#   auto     = logwall checks: INPUT policy DROP, or an active firewall agent.
#              Neither present -> preflight REFUSES to install.
#   external = you declare the baseline lives upstream (cloud security group,
#              edge firewall). logwall stops checking and trusts you.
# logwall is a denylist; it never closes ports and never sets a default policy.
BASELINE=auto

# ===== Kernel Object Names =====
# Every object logwall creates is prefixed so it can NEVER collide with another
# tool's sets. Generic names (BLACKLIST_SET, WHITELIST_SET) are what a first
# generation blocker script picks, and logwall refuses to manage those: swapping
# a set it did not create would wipe the other tool's list, and on a host with
# `INPUT policy DROP` replacing the whitelist set means instant lockout.
SET_BLACK4=LOGWALL_BL4
SET_BLACK6=LOGWALL_BL6
SET_WHITE4=LOGWALL_WL4
SET_WHITE6=LOGWALL_WL6
CHAIN_WL=LOGWALL_WL
CHAIN_BLOCK=LOGWALL_BLOCK
CHAIN_RATE=LOGWALL_RATE

MANAGE_PORTS=0              # 1 = Synchronize active ports with running services (not implemented yet)
BLOCK_PRIVATE=0             # 1 = allow blocking RFC1918 addresses (dangerous behind a load balancer)
STATE_DIR=/opt/logwall/data/state
SNAPSHOT_DIR=/opt/logwall/data/snapshot

# ===== Network & Blocker Paths =====
WHITELIST=/etc/logwall/whitelist_ips.txt
BLACKLIST=/etc/logwall/blacklist_ips.txt
SKIP_LIST=/etc/logwall/bypass_rules.txt

# ===== Detection Thresholds =====
THRESHOLD_WP_LOGIN=5          # Maximum /wp-login.php attempts per window
THRESHOLD_XMLRPC=2            # Maximum /xmlrpc.php attempts per window
# --- Volume rules: judged PER INTERVAL, and they require repetition ----------
# A modern page view is 30-80 requests, so a real visitor opening three pages is
# indistinguishable from an attacker inside any single interval. Measured on a
# production host (911,795 lines, 1,703 addresses): the peak-per-interval was 2
# at the median and 6 at p90, but reached 134, 88 and 67 for ordinary people who
# simply opened a few pages.
#
# What separates them is not the height of the spike, it is the repetition — the
# visitor is loud once, the crawler is loud for hours. On that host a threshold
# of 60 flagged 6 innocents when one interval was enough; requiring 2 intervals
# flagged none of them and lost no genuine offender.
THRESHOLD_HITS_PER_INTERVAL=60    # Requests from one address inside one interval
THRESHOLD_BW_MB_PER_INTERVAL=20   # Bandwidth from one address inside one interval.
                                  # Measured max on a real site was 8.1MB, so this is
                                  # a backstop, not a primary signal. Raise it well
                                  # above 20 on a site that serves video or archives.
STRIKES_REQUIRED=2                # Intervals over the line before a volume block
STRIKES_WINDOW=10                 # ...counted among the last this many intervals
EVAL_INTERVAL_SEC=120             # Interval width. Keep it equal to BLOCKER_SCHEDULE.
THRESHOLD_SENSITIVE_SCAN=2    # Maximum access to sensitive files (.env, .sql, .git, phpmyadmin)
THRESHOLD_PANEL_401=5         # Maximum failed panel login attempts (401/403)

# --- Signals added after the 16 Aug detection audit --------------------------
THRESHOLD_INTENT_IP=8         # wp-login + xmlrpc + sensitive-file + 401/403, SUMMED for one
                              # address. The /24 rollup has summed these four since 1.0, so a
                              # lone attacker was judged more leniently than its own neighbours:
                              # 5 wp-login + 2 xmlrpc + 2 recon + 5 rejections passed every
                              # individual threshold and was never even a candidate.
THRESHOLD_ATTACK_UA=1         # Requests carrying an offensive-scanner User-Agent (sqlmap, nikto,
                              # wpscan, nuclei, masscan, zgrab, dirbuster, gobuster, feroxbuster).
                              # One is enough - none of them has a legitimate use against someone
                              # else's server. Generic clients (curl, wget, python-requests) are a
                              # SEPARATE list and are never blocked on their name.
THRESHOLD_404_PER_INTERVAL=30 # Not-found responses per address inside one interval. Directory
                              # scanners produce these by the thousand; before 1.0.0-rc11 only
                              # 401/403 was counted, so gobuster and feroxbuster were invisible.
RATIO_404_MIN=0.60            # ...but only when that share of the address's requests were 404s.
                              # Mandatory: a site with a broken theme serves 404s to real
                              # visitors, and without this the rule convicts them.
THRESHOLD_LOGIN_POST=10       # POSTs to a login endpoint outside WordPress. GETs are not counted
                              # - a GET of /login is the form itself.
LOGIN_PATHS="/login|/signin|/admin|/administrator|/user/login|/api/auth|/api/login|/auth/login"
# ===== Subnet Aggregation =====
# A flood spread over hundreds of addresses inside one or two /24s is a single
# coordinated source. Counting only per-address makes each member creep toward
# the threshold separately, so the block lands minutes late or never — one
# coordinated source arriving as hundreds of individually harmless addresses.
SUBNET_DETECTION=1
SUBNET_PREFIX_V4=24           # aggregate IPv4 per /24
SUBNET_PREFIX_V6=64           # aggregate IPv6 per /64
SUBNET_MIN_IPS=5              # distinct active hosts required before a RANGE is
                              # ever proposed. Protects shared hosting: one heavy
                              # visitor must not drag 255 neighbours down.
SUBNET_MAX_WIDTH_V4=24        # never block anything wider than this
SUBNET_MAX_WIDTH_V6=64

# --- Second-tier IPv6 rollup -------------------------------------------------
# /64 is IPv6's single-allocation unit — the analogue of ONE IPv4 address, not of
# a /24. A crawler that takes one address out of each of its /64s therefore
# aggregates to nothing at /64: every network holds exactly one member, and the
# source arrives as dozens of separate candidates.
#
# Measured on a production host: 82 addresses of the form 2a03:2880:f800:XX::,
# ~3,000 hits each. At /64 that was 70 candidates and the circuit breaker aborted
# the run, blocking nothing. At /56 it is one entry.
#
# /56 rather than /48 because /56 covered that case completely and /48 is 256x
# wider for no additional reach. A /56 holds 256 /64s — the same factor a /24
# aggregates for IPv4, which keeps the two families symmetrical.
SUBNET6_WIDE_DETECTION=1
SUBNET6_WIDE_PREFIX=56
SUBNET6_WIDE_MIN_PREFIXES=8   # distinct /64s required before a /56 is proposed
SUBNET6_WIDE_MAX_WIDTH=56     # hard ceiling; never propose anything wider
THRESHOLD_SUBNET_HITS_PER_INTERVAL=300   # requests from the whole range inside one interval.
                              # Same strike rule as the per-address version: a CGNAT or campus
                              # range genuinely does light up for one interval when several of its
                              # users load a page at once. Measured across all /24s and /56s on a
                              # production host: p99 of per-interval hits was 67, while the one
                              # coordinated crawler sat at 3,031.
THRESHOLD_SUBNET_BW_MB_PER_INTERVAL=60   # bandwidth from the whole range inside one interval
THRESHOLD_SUBNET_AUTH=20      # failed service logins across the range
THRESHOLD_SUBNET_INTENT=20    # brute force + recon hits across the range

GOOGLE_BOT_NETS="66.249.64.0/19"   # Trusted Googlebot CIDR fast-path cache

# ===== Client Profiling (browser vs script) =====
# A browser fetches a page and then pulls its stylesheets, scripts, fonts and
# images by itself. A script fetches only what it wants. That ratio separates a
# real visitor from a scraper far more reliably than the User-Agent, which any
# scraper worth worrying about simply fakes.
#
# It also cannot be cheaply evaded: a scraper that downloads every asset in order
# to look human burns exactly the bandwidth it came to steal.
#
# Used ONLY as a modifier — never as a reason to block on its own.
CLIENT_PROFILING=1
ASSET_MIN_SAMPLES=30          # requests needed before a client is profiled at all
ASSET_RATIO_SCRIPT=0.20       # below this share of assets -> behaves like a script
ASSET_RATIO_BROWSER=0.50      # at or above -> behaves like a browser
BROWSER_TOLERANCE_FACTOR=3    # browser-like clients must exceed threshold x this
SITE_ASSET_RATIO_MIN=0.40     # if the SITE's own asset ratio is below this, assets
                              # are served elsewhere (CDN/separate domain) and the
                              # signal disables itself rather than flagging everyone

# ===== Bot Control Settings =====
BOT_UA_FILE=/etc/logwall/bot_ua_deny.txt
BOT_ASN_FILE=/etc/logwall/bot_asn_deny.txt
UPDATE_INTERVAL_DAYS=30

# ===== Login Security =====
LOGIN_FAIL_BLOCK=5            # Failed service logins (SSH/IMAP/POP3/SMTP/FTP)
                              # within INTENT_WINDOW_MIN before a permanent block
# LOGIN_RATE_PER_USER          # not implemented in 1.0 (per-username rate limiting)

# ===== Logging & Reports =====
REPORT_DIR=/var/log/logwall
REPORT_RETENTION_DAYS=30

# ===== Periodic Review Settings =====
REVIEW_SCHEDULE="0 3 * * 1"       # Weekly cron schedule (Mondays at 03:00 AM)
REVIEW_SINGLE_HIT_DAYS=30         # Single-hit IPs unappeared >= 30 days recommended for unban
REVIEW_SERVICE_IDLE_DAYS=30       # Idle services/users >= 30 days flagged for review

# ===== Dual-Stack IPv6 Settings =====
IPV6=auto                         # IPv6 mode: auto | on | off
IPV6_BLOCK_PREFIX=64              # IPv6 aggregation prefix length (default /64)

# ===== CDN / Reverse Proxy Guard =====
#
# logwall does NOT resolve real client addresses from forwarding headers, and that
# is a deliberate limit rather than a gap. Your web server already does it, and it
# does it with the one thing logwall cannot supply from a log file: a trust anchor
# naming which upstream peers are allowed to speak for someone else.
#
#   nginx      set_real_ip_from <proxy range>;  real_ip_header X-Forwarded-For;
#   Apache     RemoteIPHeader + RemoteIPTrustedProxy
#   LiteSpeed  useIpInProxyHeader 2   (2 = Trusted IP only; 1 trusts ANY client)
#   Caddy      trusted_proxies + client_ip_headers
#
# Once that is configured, the client address in the access log IS the real one and
# logwall needs no special handling at all. Where it is not configured, logwall
# declines to punish rather than guessing — see IDENTITY_GUARD below.
#
# REAL_IP_FIELD and TRUSTED_PROXIES used to be listed here. Neither was ever read
# by any code path, which is worse than a missing feature: the config promised that
# forwarded identities were being verified when nothing was verifying them.
CDN_NETS_FILE=/etc/logwall/cdn_networks.txt   # CDN Edge IP ranges - STRICTLY PROTECTED from blocking
CDN_NO_REALIP_POLICY=audit_only   # Policy when Real IP missing for CDN traffic: audit_only

# Suspends blocking for any run whose log carries a private or reserved address in
# the client field. A public server cannot be reached from 10.0.0.5 or 127.0.0.1,
# so one appearing there proves the web server is rewriting the client address from
# a header the client itself sent — at which point an attacker picks who gets
# blocked, including naming your whitelisted address to buy immunity.
# Leave this on. Turning it off does not restore detection; it restores the ability
# to be aimed by a stranger.
IDENTITY_GUARD=1

# ===== Execution Reliability =====
LOCK_FILE=/var/lock/logwall.lock
LOCK_STALE_MIN=30                 # Stale lock timeout in minutes
# --- Intent rules: summed over a SHORT SLIDING WINDOW ------------------------
# The opposite shape from the volume rules, because the traffic is the opposite
# shape. Nobody browses to wp-login.php five times by accident, so the base rate
# for a real visitor is zero and accumulation is safe here. And attackers
# deliberately go slow: four addresses on a production host were knocking on
# wp-login.php exactly TWICE per two-minute interval, sustained across 97
# intervals — 194 attempts in total. A per-interval threshold of 5 would have
# missed every one of them.
#
# The window genuinely slides: counters live in per-interval buckets that fall
# off the back, so nothing accumulates without bound. Before 1.0.0-rc12 a counter
# only reset after a full day of complete silence, which meant a daily visitor's
# total climbed forever.
INTENT_WINDOW_MIN=30              # Minutes the intent counters look back over
WINDOW_MAX_IPS=200000             # Hard cap on tracked addresses (state file size guard)
BLOCKER_SCHEDULE="*/2 * * * *"    # Cron schedule for the blocker cycle
WEBSERVER=auto                    # Webserver detection: auto | nginx | apache | litespeed | caddy
LOG_FORMAT=auto                   # Log format detection: auto | combined | json | custom
APACHE_BYTES_FIELD=auto           # Apache byte field normalization: auto | b | O
LOG_MAX_MB_PER_RUN=200            # Maximum log volume to read per execution run (MB)
# --- Catch-up guard ----------------------------------------------------------
# Replaces MAX_NEW_BLOCKS_PER_RUN, which capped how many addresses one run could
# block. That cap measured the OUTCOME and could not tell "many genuine
# offenders" from "the input was distorted"; it fired twice in production, both
# times on real abuse, and blocked nothing while the attack carried on.
#
# The distortion it was groping at is real, and it is MEASURED here rather than
# guessed: the parser now reads each line's own timestamp, so the guard compares
# the actual span of the data this run swallowed against the interval. A run that
# ingests hours of log instead of minutes inflates every volume count by the same
# factor. That happens on a fresh install (no cursor exists, so the whole existing
# log is read from byte zero) and after a cursor reset.
#
# Measuring rather than guessing matters: a host powered off for four hours wrote
# no log at all while it was down, so the GAP is four hours and the SPAN is two
# minutes. Guessing from the gap would suspend the volume rules for nothing.
#
# On such a run the VOLUME rules are suspended and the INTENT rules keep firing.
# Five probes for /.env are five probes whether they arrived over two minutes or
# two days, so brute force, recon and self-declared scanners are still blocked.
CATCHUP_GUARD=1
CATCHUP_MAX_GAP_MIN=15            # A measured span wider than this means the run
                                  # read a backlog, not one interval. Falls back to
                                  # the gap between runs only when no timestamp in
                                  # the log could be read at all.
IPSET_MAXELEM=262144              # Kernel ipset maxelem capacity
IPSET_CAPACITY_ALERT_PCT=80       # Alert threshold percentage for ipset capacity
SNAPSHOT_RETENTION=30             # Snapshot retention count
EXT_CMD_TIMEOUT_SEC=15            # External command timeout (seconds)

# ===== Anti-Lockout Safeguards =====
CONFIRM_TIMEOUT_SEC=300           # Deadman switch auto-rollback timeout (seconds)
WHITELIST_DYNAMIC_HOSTS=/etc/logwall/whitelist_hosts.txt   # Dynamic DDNS hostnames
WATCHDOG_SCHEDULE="*/10 * * * *"  # Self-test watchdog schedule (every 10 minutes)
HEARTBEAT_STALE_FACTOR=2          # Stale heartbeat multiplier
SSH_PORT=auto                     # Auto-detect SSH port from sshd_config
PROTECTED_PORTS="22,80,443,53"    # Protected ports never to be closed by sync-ports
PORT_ORPHAN_RUNS=3                # Consecutive orphan cycles required before closing port

# ===== Block Escalation Ladder =====
# How a volume-based offender is treated. Intent-based detections (login brute
# force, recon, xmlrpc) are ALWAYS permanent on first sighting and ignore this.
#   1 = first offence gets a temporary block; a repeat offence after it expires
#       becomes permanent. Protects shared addresses (CGNAT, offices, campuses)
#       from a life sentence for one burst.
#   0 = permanent immediately, always. Set this if you prefer zero tolerance.
BLOCK_ESCALATION=1
TEMP_BLOCK_HOURS=48               # Temporary block duration in hours

# Excess this far beyond the threshold is not ambiguous, so it skips the grace
# round and lands permanently on the first sighting. 0 disables the shortcut.
ESCALATE_IMMEDIATE_FACTOR=10

# How long an offender is remembered after its temporary block expired. This is
# what lets a repeat offence escalate: the memory lives in
# data/state/offender_history.json, separate from the blacklist, so it survives
# the expiring entry being removed. Addresses do get reassigned, so it is not
# forever.
OFFENDER_MEMORY_DAYS=90
KNOWN_GOOD_FILE=/etc/logwall/state/trusted_history.json   # Known-good IP reputation state

# ===== Multi-Server Fleet Sync =====
FLEET_IMPORT_MIN_HITS=3           # Minimum hit count for imported blacklist entries
FLEET_IMPORT_MAX_AGE_DAYS=90      # Maximum age for imported blacklist entries

# ===== GeoIP Filter =====
GEOBLOCK_COUNTRIES=""             # Country codes to block for admin ports (comma-separated, e.g., "CN,RU")
GEOIP_DATA=/etc/logwall/geoip/     # Path to local GeoIP database
